name: Quant-Bot-QQQ-TQQQ

on:
  schedule:
    # Runs at 14:00 UTC (10:00 PM Malaysia/Beijing Time) Monday-Friday
    - cron: '0 14 * * 1-5'
  workflow_dispatch: 

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install yfinance pandas requests
        
      - name: Execute Strategy
        run: python strategy.py
        env:
          # Secrets (Hidden)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Variables (Visible and easily editable by you)
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          HOLDING_QQQ: ${{ vars.HOLDING_QQQ }}
          HOLDING_TQQQ: ${{ vars.HOLDING_TQQQ }}
